<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Count-Up</title>
    
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">

  </head>
  <body>
   <div id="out">
    <div id="box">
      <div id="header">
        <h1 id="brand">CountUp</h1>
        <button id="theme-toggle" aria-label="Toggle dark/light theme" title="Toggle theme">
          <span class="theme-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          </span>
        </button>
      </div>
      <div id="display-container">
        <div id="sub-display"></div>
        <input type="text" id="show" readonly placeholder="0" />
      </div>
      <div id="in-btn">
        <button id="reset" class="operator">Reset</button>
        <button id="del" class="operator">Del</button>
        <button id="percent" class="operator">%</button>
        <button class="operator">/</button>

        <button>7</button>
        <button>8</button>
        <button>9</button>
        <button class="operator">*</button>

        <button>4</button>
        <button>5</button>
        <button>6</button>
        <button class="operator">-</button>

        <button>1</button>
        <button>2</button>
        <button>3</button>
        <button class="operator">+</button>

        <button id="negate" class="operator">±</button>
        <button>0</button>
        <button id="dot">.</button>
        <button id="equal" class="equal">=</button>
      </div>
  </div>
</div>

    <script src="app.js"></script>
  </body>
</html>
