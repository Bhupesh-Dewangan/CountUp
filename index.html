<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>CountUp</title>
    
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
  </head>
  <body>
   <div id="out">
    <div id="box">
      <!-- Header -->
      <div id="header">
        <div class="header-left">
          <button id="menu-toggle" aria-label="Open menu" title="Calculator modes">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
          </button>
          <div class="brand-group">
            <h1 id="brand">CountUp</h1>
            <span id="mode-badge">Standard</span>
          </div>
        </div>
        <div class="header-actions">
          <button id="theme-toggle" aria-label="Toggle dark/light theme" title="Toggle theme">
            <span class="theme-icon">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
            </span>
          </button>
        </div>
      </div>

      <!-- Navigation Drawer Overlay -->
      <div id="nav-drawer" class="drawer-hidden">
        <div class="drawer-header">
          <span>Calculator Modes</span>
          <button id="close-drawer" aria-label="Close menu">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>
        <ul class="mode-menu">
          <li>
            <button class="mode-item active" data-mode="standard">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="2" width="16" height="20" rx="2"/><line x1="8" y1="6" x2="16" y2="6"/><line x1="8" y1="10" x2="8.01" y2="10"/><line x1="12" y1="10" x2="12.01" y2="10"/><line x1="16" y1="10" x2="16.01" y2="10"/><line x1="8" y1="14" x2="8.01" y2="14"/><line x1="12" y1="14" x2="12.01" y2="14"/><line x1="16" y1="14" x2="16.01" y2="14"/><line x1="8" y1="18" x2="8.01" y2="18"/><line x1="12" y1="18" x2="12.01" y2="18"/><line x1="16" y1="18" x2="16.01" y2="18"/></svg>
              <span>Standard</span>
            </button>
          </li>
          <li>
            <button class="mode-item" data-mode="scientific">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 18h12"/><path d="M6 14h12"/><path d="M10 10l4-6"/><path d="M14 10l-4-6"/></svg>
              <span>Scientific</span>
            </button>
          </li>
          <li>
            <button class="mode-item" data-mode="programmer">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
              <span>Programmer</span>
            </button>
          </li>
          <li>
            <button class="mode-item" data-mode="financial">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
              <span>Financial & EMI</span>
            </button>
          </li>
          <li>
            <button class="mode-item" data-mode="converter">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="7 10 12 15 17 10"/><polyline points="17 14 12 9 7 14"/></svg>
              <span>Unit Converter</span>
            </button>
          </li>
          <li>
            <button class="mode-item" data-mode="date">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
              <span>Date & Age</span>
            </button>
          </li>
        </ul>
      </div>
      <div id="drawer-backdrop" class="backdrop-hidden"></div>

      <!-- Mode Viewport -->
      <div id="calculator-viewport">
        <!-- Standard Mode View -->
        <div id="standard-view" class="mode-view active-view">
          <div id="display-container">
            <div id="sub-display"></div>
            <input type="text" id="show" readonly placeholder="0" />
          </div>
          <div id="in-btn">
            <button id="reset" class="operator">Reset</button>
            <button id="del" class="operator">Del</button>
            <button id="percent" class="operator">%</button>
            <button class="operator">/</button>

            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button class="operator">*</button>

            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button class="operator">-</button>

            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button class="operator">+</button>

            <button id="negate" class="operator">±</button>
            <button>0</button>
            <button id="dot">.</button>
            <button id="equal" class="equal">=</button>
          </div>
        </div>
      </div>
    </div>
  </div>

    <script src="app.js"></script>
  </body>
</html>
